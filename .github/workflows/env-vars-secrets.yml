name: Env Vars & Secrets

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# workflow-level env: visible to every job and step below
env:
  ORG_NAME: acme-corp

jobs:
  configure:
    name: Configure & Mask
    runs-on: ubuntu-latest

    # job-level env: visible to every step in this job, overrides workflow-level
    env:
      STAGE: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # step-level env: visible only to this step, overrides job/workflow-level
      - name: Show layered env
        env:
          REGION: us-east-1
        run: |
          echo "Org: $ORG_NAME"
          echo "Stage: $STAGE"
          echo "Region: $REGION"

      # vars: repository/org-level variables, non-secret configuration
      - name: Show repository variable
        run: |
          echo "Deploy target: ${{ vars.DEPLOY_TARGET || 'not-configured' }}"

      # secrets: encrypted values, never printed directly, GitHub auto-masks them in logs
      - name: Use a secret without printing it
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API key is set (length ${#API_KEY})"
          else
            echo "API key not configured for this run"
          fi

      # ::add-mask:: manually masks a runtime-computed value that isn't a stored secret
      - name: Mask a computed token
        run: |
          TOKEN="token-$(date +%s)-${{ github.run_id }}"
          echo "::add-mask::$TOKEN"
          echo "Generated token (masked in logs): $TOKEN"

      # GITHUB_ENV: persist an env var for every later step in this job
      - name: Persist a value via GITHUB_ENV
        run: echo "BUILD_LABEL=release-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Read the persisted value
        run: echo "Build label is $BUILD_LABEL"

      # GITHUB_PATH: prepend a directory to PATH for every later step in this job
      - name: Add a tool directory via GITHUB_PATH
        run: |
          mkdir -p "$HOME/bin"
          echo '#!/usr/bin/env bash' > "$HOME/bin/hello-tool"
          echo 'echo hello from custom tool' >> "$HOME/bin/hello-tool"
          chmod +x "$HOME/bin/hello-tool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Use the tool now on PATH
        run: hello-tool

      # GITHUB_OUTPUT: expose a value to other jobs via steps/needs context
      - name: Publish a job output
        id: publish
        run: echo "label=release-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    outputs:
      label: ${{ steps.publish.outputs.label }}

  downstream:
    name: Consume Output
    runs-on: ubuntu-latest
    needs: configure

    steps:
      - name: Show label from upstream job
        run: |
          echo "Received label: ${{ needs.configure.outputs.label }}"
